<app-state-container
  [loading]="loading"
  [error]="error"
  [empty]="isEmpty"
  (retry)="onRetry()">
  
  <div class="course-list">
    <div class="list-header">
      <h1 class="list-title">Course Management</h1>
      <button class="create-button" (click)="onCreateNew()">
        <span class="button-icon">+</span>
        <span class="button-text">Create Course</span>
      </button>
    </div>

    <app-data-table
      [columns]="columns"
      [data]="courses"
      [actions]="['edit', 'delete']"
      (actionClick)="onRowAction($event)">
    </app-data-table>
  </div>

  <app-confirm-dialog
    *ngIf="showDeleteDialog"
    [message]="'Are you sure you want to delete ' + courseToDelete?.name + '? This action cannot be undone.'"
    (confirm)="onConfirmDelete()"
    (cancel)="onCancelDelete()">
  </app-confirm-dialog>
</app-state-container>
